name: ci

# No browser: Playwright's Chromium is not set up here. The tests job does
# install the renderer's Python half -- numpy, opencv, pillow, scipy --
# because most of tests/ imports it.

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.11 is the ceiling synthtiger imposes on the glyph renderer, 3.13 is
        # ahead of it. rulebase/ has to work on both: it is imported by the
        # renderer venvs *and* by the tools, which run on whatever is around.
        python: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      # numpy, opencv, pillow, scipy: most of tests/ reaches them through the
      # renderer's Python half -- `sheets/base.py` loads
      # `tools/make_ornaments.py` (numpy, PIL), `synthgen/markup.py` needs cv2,
      # the blender warp needs scipy. Measured 2026-09-23: with pytest and
      # pyyaml alone, test_qr.py and test_synthgen_augment.py fail to import
      # and pytest stops before running a single test.
      - run: python -m pip install --upgrade pip pytest pyyaml numpy "opencv-python-headless<5" pillow scipy
      - run: python -m pytest

  rules:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      # numpy, opencv and scipy are here only so `check-rules` can import
      # `degradation` -- scipy for its blender warp -- and verify that every
      # name in an augmentation chain exists. Without them it reports the
      # chains as unchecked -- which it counts as a problem, correctly: "I
      # could not look" is not "it is fine".
      - run: python -m pip install --upgrade pip pyyaml numpy "opencv-python-headless<5" scipy
      - run: python tasks.py check-rules
      - run: python tasks.py check-corpus
      - run: python tasks.py check
