# soạn tay theo agent/prompts/anatomy.md §2
# — băng hẹp của cửa hàng tiện lợi, ĐẢO thứ tự hai dòng: dòng trên là các con số (số lượng, đơn giá, thành tiền), dòng dưới mới là tên hàng trải hết bề ngang
# — người cầm băng dò số trước, đọc tên sau. Bản trước chỉ in `name` và `amount`: `menu.cnt` nằm trong nhãn mà không có cột nào in nó, và `pipeline/invariants.py` từ chối đúng như phải thế
# — bỏ một cột là bỏ một dây nối vào dữ liệu, không phải một lựa chọn thẩm mỹ
# — BA dòng một mặt hàng
# — tên, rồi số liệu, rồi mã vạch. Bản trước bỏ mã vạch, thuế suất và dòng khuyến mãi: ba trường nằm trong nhãn mà giấy không in. thêm `item.discount_row` như phôi gốc: dòng khuyến mãi là chỗ `menu.discountprice` được in ra
id: market_slim_ledger
name: Convenience roll — figures on the first line, item name beneath
source: 'soạn tay theo agent/prompts/anatomy.md §2 — băng hẹp của cửa hàng tiện lợi, ĐẢO thứ tự hai dòng: dòng trên là các con số (số lượng, đơn giá, thành tiền), dòng dưới mới là tên hàng trải hết bề ngang
  — người cầm băng dò số trước, đọc tên sau. Bản trước chỉ in `name` và `amount`: `menu.cnt` nằm trong nhãn mà không có cột nào in nó, và `pipeline/invariants.py` từ chối đúng như phải thế — bỏ một cột
  là bỏ một dây nối vào dữ liệu, không phải một lựa chọn thẩm mỹ — BA dòng một mặt hàng — tên, rồi số liệu, rồi mã vạch. Bản trước bỏ mã vạch, thuế suất và dòng khuyến mãi: ba trường nằm trong nhãn mà giấy
  không in. thêm `item.discount_row` như phôi gốc: dòng khuyến mãi là chỗ `menu.discountprice` được in ra'
