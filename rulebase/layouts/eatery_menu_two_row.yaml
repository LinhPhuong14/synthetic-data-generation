# — bề ngang lưới rộng hơn bản một dòng vì mỗi món đã tốn hai dòng: tên ít xuống dòng thì trang mới vừa khổ A4 (đo: 108.7% khi [58,66])
# — in cả `note` như phôi gốc: bỏ một cột là để lại một trường trong nhãn mà giấy không có chỗ in, đặt vào ô `stt` bỏ trống của dòng số liệu để không tốn thêm dòng
