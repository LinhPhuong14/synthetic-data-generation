# Bảng kê chi phí điều trị nội trú — cùng Mẫu số 01/KBCB, tiêu đề BA tầng.
#
# Khác `medical_statement` đúng một chỗ: `table.header_supers`. Tờ mẫu in ra
# cả hai dáng — có bệnh viện gộp mười cột chi phí dưới một tiêu đề lớn rồi mới
# chia tiếp thành nhóm nguồn thanh toán, có nơi chỉ in hai tầng — và một bộ dữ
# liệu chỉ có dáng hai tầng là bộ không dạy mô hình đọc dáng thứ ba.
#
# Là một FILE RIÊNG chứ không phải một dòng thêm vào bố cục cũ: `tools/baseline.py`
# vân tay từng ảnh, nên sửa một bố cục đã có là làm đỏ chuẩn so sánh của nó vì
# một lý do không liên quan tới chuẩn ấy. Thêm một bố cục thì bộ rộng ra, còn
# mọi trang cũ vẫn vẽ ra đúng những byte cũ.
id: medical_statement_tiers
name: Hospital cost statement — three header tiers over the payment sources
source: "cùng nguồn với medical_statement; dáng tiêu đề ba tầng của cùng mẫu 01/KBCB"
family: medical

width: [182, 196]
gutter: 1
rule_char: "-"

sheet: a4

rules: marks

sections: [letterhead, strip, doctitle, parties, table, totals, words, signatures, footer]

# HAI TỜ A4, không phải một tờ cao gấp đôi. Bảng chi phí là thứ duy nhất làm tờ
# này tràn — mười ba cột và bao nhiêu dòng là bấy nhiêu ngày nằm viện — nên nó
# là tên chạy qua cả hai tờ (`table` là tên duy nhất được phép lặp). Phần hành
# chính ở lại tờ đầu; quyết toán, số tiền bằng chữ và ô ký sang tờ sau, đúng
# chỗ người ta ký. `rows_first` là số dòng tờ đầu chứa: ít hơn tờ sau vì phía
# trên nó còn khối hành chính. Xem `rulebase/layout.py::page_order`.
#
# Số dòng thật quyết định có tờ hai hay không: một tờ bảng kê bốn dòng in gộp
# lại một tờ như trước.
page_order:
  - [letterhead, strip, doctitle, parties, table]
  - [table, totals, words, signatures, footer]

letterhead:
  frame: false
  name_scale: [1.0, 1.10]
  name_bold: true
  serial_width: 40
  labels:
    address: "Địa chỉ:"
    tax_code: ""
    phone: "Điện thoại:"
    branch: "Khoa:"
    account: ""
    form_no: "Mẫu số:"
    serial: "Số khám bệnh:"
    number: ""

strip:
  separator: "|"
  rule_after: false

doctitle:
  scale: [1.20, 1.35]

parties:
  # Hai cột: trường hành chính bên trái, mã và chỉ số bên phải. Không dòng chấm
  # — đây là bản in từ phần mềm quản lý bệnh viện, không phải tờ điền tay.
  style: two_column
  split: 0.66
  gap: 2
  leader: ""

column_header: true
column_header_bold: true
columns:
  - {key: name,         title: "Nội dung",                   width: 0,  align: left,   title_align: center}
  - {key: unit,         title: "Đơn vị tính",                width: 8,  align: center, title_align: center}
  - {key: qty,          title: "Số lượng",                   width: 6,  align: right,  title_align: center}
  - {key: price_bv,     title: "Đơn giá BV",                 width: 13, align: right,  title_align: center, cellstyle: hatch_zero}
  - {key: price_bh,     title: "Đơn giá BH",                 width: 13, align: right,  title_align: center, cellstyle: hatch_zero}
  - {key: rate_service, title: "Tỷ lệ TT dịch vụ",           width: 7,  align: center, title_align: center}
  - {key: amount_bv,    title: "Thành tiền BV",              width: 15, align: right,  title_align: center}
  - {key: rate_bhyt,    title: "Tỷ lệ TT BHYT",              width: 7,  align: center, title_align: center}
  - {key: amount_bh,    title: "Thành tiền BH",              width: 15, align: right,  title_align: center}
  - {key: fund,         title: "Quỹ BHYT",                   width: 15, align: right,  title_align: center}
  - {key: copay,        title: "Người bệnh cùng chi trả",    width: 13, align: right,  title_align: center}
  - {key: other_pay,    title: "Khác",                       width: 10, align: right,  title_align: center}
  - {key: self_pay,     title: "Người bệnh tự chi trả",      width: 14, align: right,  title_align: center}

table:
  frame: true
  row_rules: true
  blank_rows: 0
  # Bao nhiêu dòng chi phí nằm trên tờ đầu. Thấp hơn phần còn lại vì khối hành
  # chính (mã thẻ, đợt điều trị, khoa) chiếm gần nửa tờ phía trên nó.
  rows_first: 14
  shade: 0.10
  # Bốn cột cuối là bốn NGUỒN của cùng một số tiền, nên tờ mẫu gộp chúng dưới
  # một tiêu đề chung và để chín cột còn lại với xuống qua cả hai tầng. Lưới ký
  # tự không nói được điều đó — nó chỉ vẽ mười ba tiêu đề cạnh nhau; đường CSS
  # đọc khai báo này và dựng `colspan` + `rowspan` thật.
  header_groups:
    - {title: "Nguồn thanh toán (đồng)", from: fund, to: self_pay}
  # Tầng thứ ba: một tiêu đề lớn trùm lên cả khối chi phí, và chính nó lại
  # chứa nhóm "Nguồn thanh toán" ở trên. Cột nào đứng ngoài -- số thứ tự, tên
  # dịch vụ, ghi chú -- với xuống hết cả ba tầng.
  header_supers:
    - {title: "Chi phí khám bệnh, chữa bệnh", from: qty, to: self_pay}
  # Dòng nhóm và dòng "Cộng" chạy ngang sáu cột mô tả đầu bảng.
  group_span: 6
  # Bảng chạy sang trang sau thì KHÔNG lặp lại tiêu đề — đúng như tờ mẫu, và
  # cũng đỡ cho phép dò box: tiêu đề lặp là hơn trăm ký tự mà markup chỉ khai
  # một lần.
  repeat_header: false

item:
  wrap_name: true
  rows:
    - - {col: name, from: name}
      - {col: unit, from: unit}
      - {col: qty, from: qty}
      - {col: price_bv, from: price_bv}
      - {col: price_bh, from: price_bh}
      - {col: rate_service, from: rate_service}
      - {col: amount_bv, from: amount_bv}
      - {col: rate_bhyt, from: rate_bhyt}
      - {col: amount_bh, from: amount_bh}
      - {col: fund, from: fund}
      - {col: copay, from: copay}
      - {col: other_pay, from: other_pay}
      - {col: self_pay, from: self_pay}

totals:
  # Khối quyết toán chạy hết bề ngang: nó là một danh sách phân cấp, không phải
  # một cột số nép về lề phải.
  frame: false
  indent: 0.0
  emphasise_grand: true
  grand_two_lines: false

words:
  frame: false

signatures:
  name_gap: 2
  stamp_width: 40
  stamp_gap: 1

footer:
  rule_before: false