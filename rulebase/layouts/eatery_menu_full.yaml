# Thực đơn nhà hàng, khổ A4 dọc — bảng 3 cột (món / mô tả / giá) chia mục
# bằng dòng banner chạy hết bề rộng.
#
# Pha 0 của kế hoạch 19-kiểu-bảng (xem plan đã duyệt): xác nhận riêng biệt kỹ
# thuật "dòng banner colspan phân mục" (`Item.is_group` + `table.group_span`,
# đã có sẵn trong `generators/html/sheets/base.py::_group_row`) chạy đúng qua
# pipeline thật, TRƯỚC khi thêm primitive mới nào vào `components/table.py`.
# `table.group_span: 3` = đúng số cột của bảng dưới đây, nên banner mục chạy
# hết bề rộng thay vì chỉ 1 cột.
id: eatery_menu_full
name: Restaurant menu — sectioned by category, full-width banner headings
source: "layout mới, tái skin từ kỹ thuật 'restaurant menu' (10-table-layouts.html mục 6)"
family: till

width: [56, 64]
rule_char: "-"
sheet: a4

header:
  name_scale: [1.2, 1.5]
  name_bold: true
  title: true
  title_scale: [1.3, 1.6]
  address: true
  phone: true

meta:
  style: two_column
  rule_after: true

column_header: true
column_header_bold: true
columns:
  - {key: name,       title: "Món ăn",  width: 0,  align: left}
  - {key: note,       title: "Mô tả",   width: 24, align: left}
  - {key: unit_price, title: "Giá",     width: 14, align: right}

table:
  group_span: 3

item:
  wrap_name: true
  rows:
    - - {col: name,       from: name}
      - {col: note,       from: note}
      - {col: unit_price, from: unit_price}

totals:
  emphasise_grand: true
  grand_scale: [1.2, 1.5]

footer:
  rule_before: true
