        weight: 2
        requires: [rich_fields]

      - id: invoice_narrow_vertical
        tags: [fillable]
        weight: 2
        requires: [rich_fields]

      - id: invoice_sidebar
        tags: [fillable]
        weight: 2
        requires: [rich_fields]

      - id: invoice_keyvalue
        tags: [fillable]
        weight: 2
        requires: [rich_fields]

      - id: invoice_dense_table
        weight: 2
        requires: [bare_fields]

