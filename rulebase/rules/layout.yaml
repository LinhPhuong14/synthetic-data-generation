    # — và chỗ có: khối tổng tiền nép sát lề phải thay vì chạy hết bề ngang.
    requires: [doc_invoice]
    tags: [wide_paper, no_frame]
    options:
      - id: invoice_tax_en
        tags: [fillable]
        weight: 2
