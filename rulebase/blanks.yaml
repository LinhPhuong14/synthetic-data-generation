# PHÔI GỐC — mẫu chuẩn mà mỗi loại document được dựng theo
#
# "Phôi" là tờ giấy thật: một ảnh chụp hoặc bản quét của mẫu chuẩn, trước khi ai
# đo nó. `layout:` là phôi ấy sau khi đã được CHUYỂN thành bố cục đo bằng ký tự
# trong `layouts/<id>.yaml`. Một phôi chưa chuyển thì ghi `layout: null` — đó là
# việc còn nợ, và đây là chỗ nhìn thấy nó.
#
# Vì sao cần file này khi `requires`/`excludes` đã quyết định được document nào
# vẽ bằng bố cục nào: cái tag suy ra được là quan hệ, không phải CHỦ ĐÍCH. Thêm
# một bố cục mang tag rộng tay là lặng lẽ đổi mọi document trùng tag, và không
# gì báo. `documents:` dưới đây là danh sách người viết luật CHỦ Ý muốn; tag vẫn
# là bên quyết định, còn `tests/test_blanks.py` bắt lỗi khi hai bên lệch nhau.
#
# `sheet:` là bản dựng lại phát hành được của phôi — ảnh gốc là giấy tờ thật,
# mang tên người thật, nên không nằm trong kho. `null` nghĩa là chưa dựng lại.
#
# Sinh danh sách hiện thời:  make blanks

