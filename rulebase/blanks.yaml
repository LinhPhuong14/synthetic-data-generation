  # ----------------------------------------------------------------------
  # Hai mươi phôi KHÔNG đo từ ảnh nào. Chúng được soạn từ
  # `agent/prompts/anatomy.md` để lấp chỗ đói: mười một chứng từ chỉ có
  # một hoặc hai phôi mà kế hoạch chia cho năm đến bảy trang, nên luật
  # "một kiểu không lặp quá hai lần" không có gì để rẽ sang.
  # `sheet: null` và `source` nói thẳng là soạn, không phải dựng lại từ
  # một tờ giấy có thật -- gán cho chúng một tấm ảnh là khai man nguồn.

  form_dispatch_govt:
    source: "soạn tay theo anatomy.md §4 — giấy giới thiệu do cơ quan nhà nước cấp: quốc hiệu đứng trên, trường xếp MỘT cột chứ không hai, khổ A5 -- tờ nhỏ hơn nên chữ và ô ký đo ra khác hẳn bản doanh nghiệp"
    layout: form_dispatch_govt
    sheet: null

  form_dispatch_checklist:
    source: "soạn tay theo anatomy.md §4 — bản có danh mục giấy tờ người được cử phải mang: khối ghi chú biến thành danh sách ô đánh dấu, và nó đứng TRƯỚC khối các bên"
    layout: form_dispatch_checklist
    sheet: null

  form_dispatch_sectioned:
    source: "soạn tay theo anatomy.md §4 — giấy giới thiệu chia mục có chữ cái: mục A là việc phải làm, mục B là hai bên. Người đọc tờ này đọc VIỆC trước, người sau"
    layout: form_dispatch_sectioned
    sheet: null

  form_minutes_sectioned:
    source: "soạn tay theo anatomy.md §4 — biên bản chia mục: A là thành phần dự họp, B là diễn biến. Chia mục là một tầng DOM nữa, không phải một dải khối phẳng"
    layout: form_minutes_sectioned
    sheet: null

  form_minutes_govt_split:
    source: "soạn tay theo anatomy.md §4 — biên bản của cơ quan nhà nước, họp dài: quốc hiệu trên đầu, trường một cột, và phần kết luận cùng ô ký sang TỜ THỨ HAI"
    layout: form_minutes_govt_split
    sheet: null

  form_checkbox_sectioned:
    source: "soạn tay theo anatomy.md §4 — tờ kiểm có chia mục: A là trường hai cột, B là danh sách ô đánh dấu. Bản gốc chỉ có một dải ô đánh dấu, không có tầng chữ cái nào"
    layout: form_checkbox_sectioned
    sheet: null

  form_checkbox_govt:
    source: "soạn tay theo anatomy.md §4 — tờ khai một mặt do cơ quan phát: quốc hiệu, khổ A5, KHÔNG có khối các bên -- người khai tự viết vào ô, không có hai bên đối nhau"
    layout: form_checkbox_govt
    sheet: null

  form_two_column_photo:
    source: "soạn tay theo anatomy.md §4 — tờ có dán ảnh: ô ảnh chèn vào khối đầu đẩy toàn bộ trường xuống và sang, và ghi chú đứng TRƯỚC khối trường"
    layout: form_two_column_photo
    sheet: null

  form_two_column_govt_a5:
    source: "soạn tay theo anatomy.md §4 — bản khổ nhỏ do cơ quan phát: A5 thay A4, quốc hiệu, trường một cột thay hai — ba thứ cùng đổi thì mọi hộp nhãn đo ra chỗ khác"
    layout: form_two_column_govt_a5
    sheet: null

  form_cash_voucher_govt:
    source: "soạn tay theo anatomy.md §4 — phiếu thu của đơn vị sự nghiệp: khổ A4 thay A5, có quốc hiệu, trường hai cột — tờ to hơn hẳn bản phiếu thu doanh nghiệp"
    layout: form_cash_voucher_govt
    sheet: null

  form_questionnaire_checklist:
    source: "soạn tay theo anatomy.md §4 — phiếu khảo sát dạng chọn: mục A là người trả lời, mục B là các ô đánh dấu — khác hẳn bản hỏi-đáp toàn chữ"
    layout: form_questionnaire_checklist
    sheet: null

  form_dense_photobox:
    source: "soạn tay theo anatomy.md §4 — tờ khai có dán ảnh: `page.photobox` chèn ô ảnh vào khối đầu, đẩy toàn bộ trường xuống và sang -- mọi hộp nhãn dịch chỗ"
    layout: form_dense_photobox
    sheet: null

  eatery_menu_vat:
    source: "soạn tay theo anatomy.md §2 — hoá đơn nhà hàng khổ A4 có thuế: sáu cột, và hai cột cuối nằm dưới MỘT ô tiêu đề mẹ 'Số tiền (đồng)' — tiêu đề hai tầng"
    layout: eatery_menu_vat
    sheet: null

  eatery_menu_two_row:
    source: "soạn tay theo anatomy.md §2 — mỗi món chiếm HAI dòng: dòng trên là số thứ tự và tên món trải hết bề ngang, dòng dưới là số lượng / đơn giá / thành tiền thụt vào"
    layout: eatery_menu_two_row
    sheet: null

  eatery_menu_note_rail:
    source: "soạn tay theo anatomy.md §2 — tờ ghi kèm yêu cầu của khách: một cột ghi chú rộng chạy dọc bên phải tên món, giá đứng sau cùng — ba cột chứ không sáu"
    layout: eatery_menu_note_rail
    sheet: null

  eatery_vat_grouped:
    source: "soạn tay theo anatomy.md §2 — hoá đơn quán có thuế in trên giấy cuộn: cột suất thuế và cột tiền gộp dưới một ô 'Thuế GTGT' — bảng hai tầng trên giấy hẹp"
    layout: eatery_vat_grouped
    sheet: null

  eatery_vat_vertical:
    source: "soạn tay theo anatomy.md §2 — sáu cột trên giấy cuộn hẹp: nhà in XOAY DỌC tiêu đề cột để chúng vừa bề ngang, một trò có thật khi cột nhiều hơn giấy"
    layout: eatery_vat_vertical
    sheet: null

  market_barcode_two_row:
    source: "soạn tay theo anatomy.md §2 — băng siêu thị thật in mã vạch và tên trên MỘT dòng, rồi dòng dưới mới là số lượng nhân đơn giá — hai dòng một mặt hàng"
    layout: market_barcode_two_row
    sheet: null

  market_slim_ledger:
    source: "soạn tay theo anatomy.md §2 — băng hẹp nhất kho: chỉ hai cột, số lượng gộp vào dòng ghi chú dưới tên hàng — tờ giấy không đủ chỗ cho một cột riêng"
    layout: market_slim_ledger
    sheet: null

  eatery_tab_unit:
    source: "soạn tay theo anatomy.md §2 — phiếu tính tiền quán nhậu có cột đơn vị (chai / lon / đĩa): bốn cột một dòng, khác hẳn bản hai dòng có cột số thứ tự"
    layout: eatery_tab_unit
    sheet: null

