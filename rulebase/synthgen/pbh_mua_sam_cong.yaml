# phôi khai bằng file — xem synthgen/archetypes.py
#
# Sinh theo lô "300 phôi chia đều": tên là `<thể loại> + <lĩnh vực>`,
# đúng cách chứng từ hành chính Việt Nam đặt tên.
#
# Trần số tờ và khối chảy đọc từ THỂ LOẠI in trên tiêu đề
# ("PHIẾU BÁN"), không theo vị trí trong vòng sinh — xem lịch sử:
# bậc cũ gán bằng `index % 3` nên mọi thể loại đều chia 1/3-1/3-1/3,
# và một HỢP ĐỒNG bị khoá một tờ. Khối chảy: table; trần: 3.
# Trần dòng bảng [4, 35] -> [4, 80]: `paginate` ĐO được ~26 dòng một
# tờ, chứ không 15 như `FLOW_PER_PAGE` ước lượng, nên trần cũ chỉ nuôi
# nổi hai tờ. Đo trên `data/smoke_multipage_v4`: "78 dòng cần cho 3 tờ
# vượt trần 50 của chứng từ", hai lần trên 30 tài liệu.
