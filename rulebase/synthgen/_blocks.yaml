# Hình dạng của bộ dữ liệu synthgen: khối nào có mặt bao nhiêu, ở đâu.
#
# Gạch dưới đầu tên để `archetypes.load()` không đọc file này như một phôi --
# cùng lệ `rulebase/rules/_order.yaml` đã đặt, và cùng lý do.
#
# BỐN MỤC, và chúng chồng lên nhau theo thứ tự này -- mục sau chỉ đổi được
# trong giới hạn mục trước:
#
#   allow:            phôi NÀO được gắn khối nào          (trần cứng)
#   chance:           xác suất khối tuỳ chọn được bốc
#   multipage_boost:  nhân xác suất ấy lên khi `--pages` đòi tài liệu dài
#   flow_weight:      khối CHẢY nào thắng khi có nhiều khối chảy cùng lúc
#
# Thứ tự ấy là thứ tự phải đọc khi một con số không nhúc nhích: `chance: 1.0`
# cho một khối mà `allow:` chỉ mở cho 8% số phôi thì vẫn ra 8%.
#
# ĐO TRƯỚC VÀ SAU MỖI LẦN ĐỔI: `make synth-balance`. Kho này đã hai lần đổi
# một cái lệch lấy một cái lệch khác vì chỉnh trọng số rồi mới đo.
#
# Vì sao ra file: đây là những con số sửa là đổi cả bộ dữ liệu, và trước đây
# chúng nằm trong một dict viết thẳng giữa `synthgen/design.py::draw`. Muốn hạ
# tỉ lệ bảng xuống thì phải sửa mã nguồn, tức là chỉ người sửa mã mới đổi được
# hình dạng của bộ -- đúng ranh giới mà `rulebase/` sinh ra để xoá.
#
# `default` áp cho khối không có tên ở dưới: thêm một khối mới vào
# `design.BLOCKS` thì nó có ngay một xác suất hợp lý, không phải nhớ sửa file
# này mới thấy nó xuất hiện.

default: 0.4

chance:
  # --- khối gần như tờ nào cũng có
  meta: 0.7
  fields: 0.6
  footer: 0.55

  # --- phần chữ
  # ĐO TRƯỚC KHI CHỈNH. Bản trước để `clauses: 0.55`, và đo trên 1200 tờ ra:
  #
  #     List-Group  82%   Form 7%   Bibliography 21%   Table-Of-Contents 6%
  #
  # tức là đã đổi "tờ nào cũng có bảng" lấy "tờ nào cũng có một danh sách
  # điều khoản". Một mô hình học trên bộ ấy vẫn học một cái lệch, chỉ khác
  # tên nhãn. Hạ `clauses` về ngang hàng, và nâng những khối có nhãn vùng
  # hiếm -- `questions` (Form), `toc` (Table-Of-Contents), `figure`
  # (Figure+Caption), `checks` -- lên cho đủ mặt.
  #
  # Đây là những con số phải ĐO LẠI mỗi lần đổi, không phải đoán lại: chạy
  # `python synthgen/run.py --dry-run` cho phân bố khối, và đếm `data-region`
  # trên chính markup cho phân bố nhãn vùng.
  sections: 0.45
  notes: 0.45
  questions: 0.45
  legal_basis: 0.4
  words: 0.45
  footnote: 0.35
  clauses: 0.35
  checks: 0.35
  summary: 0.32
  formula: 0.3
  figure: 0.3
  toc: 0.3
  photo: 0.25

  # --- bảng
  # Đo trước khi có file này: 77% số tờ vẽ ra có bảng, ở mức 0.35. Một mô
  # hình học trên bộ ấy học rằng "chứng từ Việt Nam" nghĩa là "một cái bảng
  # có chữ quanh nó". Giấy tờ thật không thế: công văn, tờ trình, biên bản
  # họp, giấy uỷ quyền, quy chế nội bộ đều không có bảng nào.
  #
  # Con số này KHÔNG phải cái duy nhất quyết tỉ lệ bảng, và trước đây người
  # ta tưởng thế. Cái còn lại là `paginate.py` chỉ cắt trang được theo dòng
  # bảng, nên MỌI tài liệu nhiều trang đều có bảng dù con số này bằng bao
  # nhiêu. Khối chảy đã tách khỏi bảng; đây giờ mới thật sự là cái van.
  # ĐO LẠI 23-09-2026, sau khi lô 300 phôi nhận khối chảy theo thể loại giấy:
  # 84 phôi mới khai `table` (24 phôi `always` -- bảng kê, hoá đơn; 60 phôi
  # `optional` -- các loại phiếu). Cùng `chance: 0.22` mà nguồn cung gấp ba
  # thì tỉ lệ tài liệu có bảng nhảy 7% -> 25%, quá mức 10% đã chốt.
  #
  # Van phải hẹp lại đúng bằng phần nguồn cung nở ra, chứ không phải bỏ bớt
  # phôi: một `PHIẾU XUẤT KHO` không có bảng là tờ giấy sai.
  table: 0.12

# Khối chảy nào được chọn khi một tờ giấy có nhiều khối chảy cùng lúc, và khối
# nào bị ÉP vào khi `--pages` đòi nhiều tờ mà tờ giấy không có khối nào chảy
# được. Bốc theo trọng số dưới đây -- xem `design.pick_flow`.
#
# Vì sao không phải một thứ tự ưu tiên: thứ tự ưu tiên nghĩa là khối đứng đầu
# luôn thắng, nên nhãn vùng của nó thành nhãn vùng của cả bộ. Đúng cái đã xảy
# ra hai lần trong file này -- `Table` 77%, rồi `List-Group` 82%.
#
# `table` thấp nhất và có lý do: nó là khối chảy DÀI nhất (một bảng kê chứa
# 240 dòng, một bộ điều khoản chỉ 46 điều), nên mỗi lần nó thắng là nó lấy
# nhiều tờ hơn hai khối kia. Cân theo số TỜ chứ không theo số tài liệu.
flow_weight:
  sections: 1.2
  questions: 1.1
  clauses: 0.9
  table: 0.3

# Phôi NÀO được gắn khối nào -- tầng dưới `chance` một bậc, và là tầng thật sự
# quyết cân bằng. Đo trước khi viết phần này:
#
#     clauses  95% số phôi cho phép      questions  8%
#     table    94%                       checks    10%
#     notes    99%                       photo      7%
#
# Một khối chỉ 8% số phôi cho phép thì không `chance` nào nâng nó lên được:
# nâng lên 1.0 vẫn chỉ ra 8%. Đó là lý do bản trước chỉnh `chance` mãi mà
# `Form` vẫn 2% còn `List-Group` vẫn 58%.
#
# Luật đọc TÊN phôi, cùng lối `content._theme_for` chọn bộ câu hỏi: tên một
# tài liệu nói nó là loại giấy gì, còn `profile` chỉ nói nó thuộc ngành nào --
# ba phôi hành chính khác hẳn nhau vẫn cùng một `profile`. So khớp không phân
# biệt hoa thường, trên `titles` của phôi.
#
# `synthgen/design.py::_widen` đọc mục này và GẮN THÊM vào `optional`. Phôi đã
# khai khối ấy trong `always` thì không đổi: file này nới rộng, không thu hẹp
# thứ người viết phôi đã quyết -- trừ `clauses`, xem dưới.
allow:
  # `clauses` là khối DUY NHẤT ở đây bị thu hẹp chứ không nới rộng. Trước đây
  # `_widen` gắn nó cho mọi phôi có bộ chữ ký từ hai người trở lên, ra 95% số
  # phôi -- nên "Điều 1., Điều 2." in lên cả thẻ kho lẫn phiếu xét nghiệm.
  # Giấy mang điều khoản đánh số là giấy RÀNG BUỘC: hợp đồng, quy chế, quyết
  # định, thoả thuận, uỷ quyền.
  clauses:
    replace: true
    title_any: [hợp đồng, quy chế, nội quy, quyết định, thoả thuận, thỏa thuận,
                cam kết, cam đoan, uỷ quyền, ủy quyền, điều lệ, phụ lục,
                bảo hiểm, bảo hành, tín dụng, thuê, nguyên tắc, lao động,
                biên bản, thông báo, công văn,
                # `chứng chỉ`, `hành nghề`: chứng chỉ hành nghề thật in PHẠM VI
                # HÀNH NGHỀ thành các mục đánh số ở mặt sau. Không có hai từ
                # này thì `chung_chi_hanh_nghe` không có khối chảy nào và
                # `--multipage-only` loại sạch seed của nó.
                chứng chỉ, hành nghề]

  # Tờ khai, phiếu đăng ký, phiếu đánh giá -- nhãn `Form`. Đang 8% số phôi.
  questions:
    title_any: [tờ khai, khai, đăng ký, đánh giá, khảo sát, phiếu khám,
                yêu cầu, đề nghị, khiếu nại, xin, hồ sơ, dự thi, nhập học,
                tuyển, phỏng vấn, bệnh, sức khoẻ, sức khỏe, bảo hiểm,
                bồi thường, chuyển tuyến, hội chẩn, chỉ định]
    # Giấy y tế và bảo hiểm gần như tờ nào cũng có một cụm câu hỏi đánh số --
    # tiền sử, triệu chứng, kê khai rủi ro -- kể cả khi tên không nói.
    profile_any: [medical, insurance]

  # MỤC VĂN XUÔI -- nhãn `Section-Header` + `Text`. Đối chiếu ảnh pilot16:
  # `Section-Header` có trên 48% trang pilot và 5% trang synthgen, và đó là
  # khác biệt làm trang pilot đọc như một văn bản còn trang synthgen không
  # bảng vẫn đọc như biểu mẫu.
  #
  # Giấy mang mục văn xuôi là giấy có phần THUYẾT MINH: biên bản, báo cáo,
  # tờ trình, công văn, đề án, quy chế. Một vé gửi xe thì không.
  sections:
    title_any: [biên bản, báo cáo, tờ trình, công văn, thông báo, đề án,
                phương án, kế hoạch, quy chế, nội quy, quyết định, hợp đồng,
                nghiệm thu, bàn giao, giám định, kiểm kê, hội chẩn, điều lệ,
                thuyết minh, tổng hợp, đánh giá, khiếu nại, giải trình]

  # Ô tích chọn -- cụm biểu mẫu người ta đánh dấu. Đang 10% số phôi.
  checks:
    title_any: [phiếu, biên nhận, giao nhận, bàn giao, kiểm kê, nghiệm thu,
                tiếp nhận, đăng ký, tờ khai, xác nhận, chuyển tuyến]

  # Sơ đồ kèm chú thích -- nhãn `Figure` + `Caption`. Đang 23% số phôi.
  figure:
    title_any: [biên bản, báo cáo, nghiệm thu, bàn giao, kỹ thuật, bản vẽ,
                sơ đồ, nhật ký, giám định, kiểm kê, thiết kế, công trình]

  # Mục lục -- nhãn `Table-Of-Contents`. Đang 30% số phôi, và luật cũ đòi
  # `rows[1] >= 60` tức là đòi một cái BẢNG dài; mục lục thì đi với tài liệu
  # dài, mà dài không còn đồng nghĩa với có bảng nữa.
  toc:
    title_any: [hợp đồng, quy chế, điều lệ, báo cáo, hồ sơ, tài liệu,
                quyết định, nội quy, đề án, phương án, biên bản, bảng kê,
                danh sách, sổ, kế hoạch, dự toán, thuyết minh, tổng hợp,
                chương trình, hướng dẫn, thông báo, công văn]

  # Ô dán ảnh. Đang 7% số phôi.
  photo:
    title_any: [hồ sơ, đăng ký, dự thi, chứng chỉ, thẻ, giấy phép, tuyển,
                nhập học, chứng nhận, lý lịch]

# Khi `--pages` đòi tài liệu dài (trần số tờ > 2), nhân `chance` ở trên lên.
# Một tờ giấy bốc được ba khối rải lên sáu tờ thì vẫn còn bốn tờ chỉ có mỗi
# khối chảy — đúng cái "một màu trải dài từ đầu tới cuối" phải xoá.
#
# THEO TỪNG KHỐI, không đều tay, vì thứ làm một tờ giữa hết đơn điệu là khối
# CHIẾM CHỖ. Ghi chú dấu sao, dòng "bằng chữ", công thức một dòng chỉ thêm
# một nhãn vùng chứ không đổi hình dạng tờ giấy — để chúng ở 1.0. Đo ở hệ số
# 2.4 đều tay: `Footnote` 82% số tờ, `Figure` mới 22%.
multipage_boost:
  default: 1.0
  # --- khối chiếm chỗ, đổi được hình dạng một tờ
  figure: 2.6
  sections: 2.4
  # `table: 1.0` -- KHÔNG nhân. Đo bốn mức 1.0/1.3/1.7/2.4: bảng trên
  # trang giữa chỉ nhích 16%->21%, còn "tờ chỉ có khối chảy" đứng im ở
  # 28%. Tức là nhân bảng lên gần như không mua được sự đa dạng nào,
  # mà ở mức 2.4 nó kéo xác suất thật của bảng từ 0.22 lên 0.53 --
  # đúng cái van `chance.table` sinh ra để đóng. Cùng lập luận đã đặt
  # `footnote` ở 1.0.
  table: 1.0
  checks: 2.4
  toc: 2.4
  summary: 2.2
  photo: 2.0
  notes: 1.8
  questions: 1.6
  fields: 1.4
  clauses: 1.2
  # --- khối một-hai dòng: KHÔNG nhân
  footnote: 1.0
  words: 1.0
  formula: 1.0
  legal_basis: 1.0

# Trần của phép nhân trên. Khối nào `chance` đã cao hơn trần thì giữ nguyên
# `chance`, không bị hạ: file này để LÀM GIÀU tài liệu dài, không làm nghèo.
multipage_cap: 0.62

# Mực không-phải-chữ (dấu, mã vạch, mã QR) đứng ở đâu trên tờ giấy. Bản trước
# chỉ có MỘT chỗ — cuối tờ cuối — viết thẳng trong thân vòng lặp của
# `markup()`, nên mọi mã vạch trong bộ nằm đúng một chỗ. Giấy thật: hoá đơn
# bán lẻ in mã vạch ngay dưới tên cửa hàng, phiếu gửi xe in mã QR góc trên
# bên phải, sổ nhiều trang đánh dấu từng tờ. Xem `design.MARK_PLACES`.
mark_place:
  cuoi: 1.0
  dau: 0.55
  goc_phai: 0.4
  moi_to: 0.25

# TRANG TRÍ — phần không mang chữ: khung trang, dải màu mép giấy, nền hoa văn,
# kiểu logo, điểm nhấn màu. Lấy từ ảnh pipeline chính (`data/layouts_all/`):
# khung an ninh của hoá đơn GTGT điện tử, dải màu của hoá đơn khách sạn, logo
# chữ lồng và cột nhãn tô nền của giấy chứng nhận bảo hiểm. Xem
# `design.PAGE_FRAMES` và mấy trục cạnh nó.
#
# Khoá lạ thì `design.draw_decor` NÉM — gõ sai một tên ở đây không được phép
# lặng lẽ thành trọng số mặc định.
#
# `khong` giữ trọng số lớn nhất ở mỗi trục: văn bản hành chính thật phần lớn
# vẫn trơn. Nhưng các trục bốc độc lập, nên tờ trơn trên CẢ năm trục chỉ còn
# chừng 5% — phần còn lại có ít nhất một thứ trang trí.
#
# Dải mép giấy và khung trang loại trừ nhau (dải thắng), nên tỉ lệ khung thật
# ra thấp hơn con số ở đây gợi ý: ~0.55 × phần của khung.
decor_band:
  khong: 5.0
  tren: 1.0
  tren_duoi: 1.0
  trai: 0.8
  tren_song: 0.8
# Mười bốn kiểu khung, và mỗi kiểu còn bốn tham số bốc riêng (khoảng lùi, độ
# dày, màu, biến thể -- `design.FRAME_*`). Bản đầu năm kiểu, mỗi kiểu một bộ số
# cố định: nhìn hai mươi tờ là thấy cùng một khung lặp lại. Trọng số chia đều
# cho các kiểu có khung để không kiểu nào thành "khung của cả bộ".
decor_frame:
  khong: 5.0
  don: 0.7
  doi: 0.7
  an_ninh: 0.8
  goc: 0.7
  bo_tron: 0.6
  ba_vien: 0.6
  cham: 0.5
  gach: 0.5
  chuoi_hat: 0.5
  rang_cua: 0.4
  goc_tron: 0.6
  vat_goc: 0.5
  tem_thu: 0.4
  tren_duoi_ke: 0.6
decor_ground:
  khong: 6.0
  hoa_van: 1.0
  ke_cheo: 0.6
  cham_luoi: 0.6
# Chỉ có tác dụng khi `head_layout` có logo (`*_co_logo`, `logo_phai`).
decor_logo:
  mo: 1.0
  o_chu: 1.3
  vong_chu: 1.0
  chu_mau: 0.8
# XÁC SUẤT, không phải trọng số: mỗi điểm nhấn bốc độc lập.
decor_accent:
  tieu_de_mau: 0.35
  ghi_chu_the: 0.3
  tong_noi_bat: 0.3
  nhan_mau: 0.25

# BẢNG CỦA PHÔI NÀY LIỆT KÊ CÁI GÌ — tra theo TÊN tài liệu, không theo ngành.
#
# Vì sao cần: `corpus.catalogue()` chọn kho hàng theo `profile`. Học bạ, bảng
# điểm, thời khoá biểu, bảng lương, danh sách học viên đều là `admin`, nên cả
# năm lấy chung `items_admin.txt` — và một tờ HỌC BẠ liệt kê "Ấm siêu tốc
# inox", "Bình chữa cháy bột ABC", một BẢNG ĐIỂM liệt kê "Kệ sắt lưu trữ hồ
# sơ". Đo được trên bản vẽ thật, và đó là lỗi nặng hơn mọi lệch phân bố: nhãn
# KIE vẫn đúng chỗ, nhưng chữ trên giấy là chữ không tờ nào in ra.
#
# Ngành nói tờ giấy thuộc về AI; tên tờ giấy mới nói nó liệt kê CÁI GÌ. Cùng
# nhận xét đã dẫn tới `content._theme_for` và mục `allow` ở trên.
#
# Khoá là TÊN FILE corpus (`rulebase/corpus/vi/<khoá>.txt`); phôi không khớp
# mẫu nào vẫn rơi về kho theo ngành như cũ. Nhiều kho khớp thì gộp cả.
items:
  items_hoc_tap:
    title_any: [học bạ, bảng điểm, thời khoá biểu, sổ liên lạc,
                kết quả học tập, phiếu điểm,
                # Bằng/giấy chứng nhận tốt nghiệp in kèm BẢNG ĐIỂM ở tờ sau,
                # nên bảng của nó liệt kê môn học. Không có ba từ này thì nó
                # rơi về kho theo ngành và liệt kê "Tủ hồ sơ sắt hai cánh" --
                # đo được trên `giay_chung_nhan_tot_nghiep_00004_p2`.
                tốt nghiệp, học bạ, bảng ghi điểm]
  items_luong:
    title_any: [lương, chấm công, thu nhập cá nhân, tăng ca, làm thêm giờ]
  items_dao_tao:
    title_any: [học viên, đào tạo, khoá học, tập huấn, bồi dưỡng]

# ---------------------------------------------------------------------------
# region: KHỐI NÀY MANG NHÃN VÙNG BỐ CỤC NÀO
#
# Trước mục này, nhãn vùng của một khối nằm rải trong `synthgen/markup.py`
# dưới dạng `data-region="..."` viết thẳng vào chuỗi f-string -- mười lăm
# chỗ -- và MƯỜI khối còn lại thì không khai gì cả. Hệ quả đo được trên 25 tờ
# `data/thu1k/html`: 874 trên 4404 run (19,8%) không nằm trong vùng nào đã
# khai, nên vùng của chúng được `pipeline/record.py` DỰNG LẠI bằng cách gom
# từ theo ngưỡng khe -- `visible_content_union_perimeter`, 53% số vùng của cả
# bộ. Một cái máng giữa hai cột rộng hơn ngưỡng là một khối bị xé làm đôi, và
# không gì báo.
#
# Nhãn ở đây là NHÃN, không phải trọng số: nó không đổi khối nào có mặt, chỉ
# đổi khối ấy tự xưng là gì. Nhưng nó vẫn thuộc về file này vì nó cũng là
# "con số sửa là đổi cả bộ dữ liệu" -- đổi `fields` từ Form sang Text là đổi
# phân bố nhãn của mọi tờ có khối ấy.
#
# ĐO SAU MỖI LẦN ĐỔI: `make synth-balance`. Và nhớ lệ của kho -- tổng luôn
# bằng hằng số, nên nâng một nhãn là hạ mọi nhãn khác.
#
# Khối KHÔNG có tên ở đây thì không khai `data-region`, và vùng của nó lại
# rơi về bộ gom theo ngưỡng. Không có bản mặc định trong mã: một bảng thứ hai
# trong `design.py` là đúng cái bệnh mục này sinh ra để chữa.
#
# Mọi nhãn phải nằm trong `pipeline/record.py::DOCSYNTH_LABELS`;
# `tests/test_synthgen_regions.py` giữ lời hứa ấy.
region:
  # --- neo đầu tờ
  letterhead: Page-Header
  doctitle: Title
  meta: Text               # "Số: … / Ký hiệu: … / Hà Nội, ngày …" -- chữ in
                           # sẵn để ĐỌC, không phải ô để điền. Xem `fields`.
  legal_basis: Bibliography

  # --- thân tờ
  fields: Form             # khối "nhãn : giá trị" có dấu chấm/gạch để điền --
                           # đúng nghĩa Form trong bộ nhãn DocLayNet.
  notes: Text
  checks: Form
  questions: Form
  clauses: List-Group
  # `sections` in RA HAI vùng, cùng lối `figure`: tiêu đề mục là
  # `Section-Header`, thân mục là `Text`. Không khai `sections` -- khối bọc
  # không phải một vùng, xem `regions_from_words`.
  section_header: Section-Header
  section_body: Text
  formula: Formula
  figure: Figure
  figure_caption: Caption  # `_figure` in RA HAI vùng; đây là vùng thứ hai.
  table_caption: Caption   # chú thích bảng. `table` KHÔNG khai vùng (xem
                           # ghi chú bên dưới) nên câu này không có tổ tiên
                           # nào ôm -- phải tự khai, cùng lẽ `figure_caption`.
  toc: Table-Of-Contents
  totals: Text
  words: Text
  footnote: Footnote
  national: Page-Header    # quốc hiệu khi letterhead KHÔNG chia đôi; khi chia
                           # đôi nó nằm trong `.hrow` đã khai, nên không khai
                           # lại -- hai vùng lồng nhau là một vùng nói hai lần.

  # KHÔNG khai ở đây: `table` và `summary`. Cả hai LÀ `<table>`, và
  # `generators/html/page.py::CELL_REGIONS_JS` đã dựng vùng `Table` cho chúng
  # từ chính các ô. Khai thêm `data-region` lúc này là vùng thứ hai chồng lên
  # vùng ấy -- đúng lỗi đo được trên `llm_export_invoice_0003` (bốn vùng
  # `Table` thay vì hai). Chúng chỉ vào bảng này khi thẩm quyền "vùng này có
  # hay không" chuyển hẳn về `data-region`, và phép đo ô lùi về chỉ còn cấp
  # HỘP -- xem `pipeline/tags.py`.

  # --- neo cuối tờ
  signatures: Text         # KHỐI CHỮ KÝ LÀ CHỮ, KHÔNG PHẢI BIỂU MẪU.
                           #
                           # Thứ IN RA là chữ: chức danh, "(Ký, ghi rõ họ
                           # tên)", họ tên. Nét ký là MỰC, và mực có vùng
                           # riêng của nó -- `Form` là chỗ người ta ĐIỀN, như
                           # `fields` có dòng chấm hay `photo` có khung dán
                           # ảnh.
                           #
                           # `pipeline/record.py::DOCSYNTH_LABEL_FOR_KIND` đã
                           # chốt `sign.` là `Text` và viết hẳn lý do, nhưng
                           # dòng này khai ngược -- và `data-region` thắng.
                           # Đo trên `data/review100b`: 175 vùng chữ ký mang
                           # nhãn `Form`, chỉ 52 mang `Text`. Một luật, hai
                           # người dựng, hai câu trả lời.
  footer: Page-Footer
  barcode: Text            # dãy số in dưới mã vạch / QR. Chữ ĐỌC ĐƯỢC đứng
                           # cạnh một `data-graphic`, nên nó cần vùng riêng:
                           # hình có `GRAPHIC_RECTS_JS` lo, chữ thì không.
  sign_date: Text          # "Đà Lạt, ngày 18 tháng 06 năm 2026" nằm NGOÀI
                           # `.signs`, ngay trong `.blk`. Khai lên `.blk` thì
                           # vùng ấy trùm luôn khối chữ ký đã khai.
  photo: Form              # ô dán ảnh 4x6 trên tờ khai: một cái khung để
                           # ĐIỀN, và nó có chữ in sẵn ("ẢNH", "4 x 6") nên
                           # phải có vùng. KHÔNG phải `Image`: không có ảnh
                           # nào trong đó, và `Image` là nhãn của mực thật.
  pagenum: Page-Footer     # số tờ, `markup()` in mỗi `.sheet` một cái.

  # --- mực phủ
  watermark: Watermark

# ---------------------------------------------------------------------------
# gate: NGƯỠNG CỦA CỔNG GÁC, cho trang do model viết
#
# `synthgen/llm_page.py` ĐO, file này nói bao nhiêu thì quá. Tách hai việc ấy
# vì chúng đổi theo hai nhịp khác nhau: phép đo đúng hay sai là chuyện của mã
# và của test, còn "bao nhiêu thì quá" là một núm siết dần theo số đo thật --
# và siết nó không nên phải sửa mã.
#
# --- orphan_share ---------------------------------------------------------
#
# Tỉ lệ run có `data-kind` mà KHÔNG nằm trong vùng bố cục nào đã khai. Chữ ấy
# vẫn có hộp, nhưng vùng của nó do `pipeline/record.py` gom theo ngưỡng khe
# dựng ra -- và bộ gom cắt ở chỗ hở ngang, nên một khối "nhãn ... giá trị" ra
# hai vùng, một khối tổng tám dòng ra tám vùng.
#
# ĐO TRÊN 40 TỜ MODEL VIẾT, sau `repair.zoned()`, chia theo kết cục cổng:
#
#                  trung vị   phân vị 75   phân vị 90
#   đã QUA cổng      10,5%       41,1%        83,3%
#   đã trượt cổng     4,1%       66,3%        83,8%
#
# Trang QUA cổng còn tệ hơn trang trượt: không phép kiểm nào đang chạy có
# tương quan với lỗi này. Nó lọt hoàn toàn, và lọt vào đúng tập đem đi huấn
# luyện.
#
# 0.99 là mức KHÔNG LOẠI GÌ trên thực tế -- chỉ chặn tờ mà gần như không một
# chữ nào thuộc vùng nào, thứ vô dụng với mọi mô hình bố cục. Con số mồ côi
# vẫn được ghi vào `compose_report.json` cho MỌI tờ, kể cả tờ qua cổng, nên
# siết dần là việc đọc báo cáo rồi hạ số này -- không phải đoán.
#
# Đường siết theo số đo trên: 0.99 -> 0.85 (cắt phân vị 90) -> 0.45 (cắt phân
# vị 75) -> 0.15. Mỗi bậc đo lại tỉ lệ qua cổng TRƯỚC khi đi tiếp: kho này đã
# một lần siết luật kế hoạch mà không đo trước, và nó giết 4 trên 6 tờ.
# ---------------------------------------------------------------------------
# region_alias: TÊN VÙNG MODEL HAY VIẾT NHẦM -> tên thật
#
# `data-region` là từ vựng ĐÓNG (20 nhãn, `synthgen/llm_page.py::REGIONS`).
# Model thỉnh thoảng viết một cái tên nghe đúng mà không có trong bảng, và
# gần như luôn vì nó lẫn HAI TRỤC: `masthead` là một `data-kind` CÓ THẬT của
# engine -- tên của một khối chữ -- chứ không phải tên một vùng bố cục.
#
# Đo trên `data/23-09-llm-b` (10 tờ, gpt-4.1-mini): 3 tờ trượt cổng chỉ vì
# ba cái tên dưới đây. Không tên nào là một khái niệm MỚI; cả ba đều có đúng
# một chỗ đúng trong bảng nhãn thật.
#
# Vì sao là DỮ LIỆU: thêm một bí danh là thêm một dòng ở đây, không phải sửa
# `repair.py`. Và vì sao chỉ ở đây: một bảng bí danh viết trong mã là người
# dựng thứ hai của cùng một luật -- đúng lỗi nặng nhất kho này có.
#
# Chỉ nhận bí danh có ĐÚNG MỘT cách chữa. Một cái tên model bịa mà không ai
# biết nó định nói gì thì KHÔNG vào đây: để cổng loại, đúng nguyên tắc
# `synthgen/repair.py` -- một cái hộp gán nhãn đoán còn tệ hơn không có hộp.
region_alias:
  masthead: Page-Header      # `masthead` là data-kind của engine, không phải vùng
  header: Page-Header
  footer: Page-Footer
  note: Text
  notes: Text
  body: Text
  paragraph: Text
  heading: Section-Header
  subtitle: Section-Header
  list: List-Group
  signature: Text            # KHỐI CHỮ KÝ LÀ CHỮ -- xem `signatures` ở `region:`
  seal: Stamp
  logo: Image
  figure_caption: Caption
  toc: Table-Of-Contents

# --- plan_drop_share -------------------------------------------------------
#
# Tỉ lệ `kind` model hứa trong `field_plan` mà trang KHÔNG in ra. Vượt ngưỡng
# thì trang bị loại.
#
# Con số này PHỤ THUỘC MODEL, và đó là lý do nó ở đây chứ không trong mã:
#
#   Qwen3-27B  (pilot9)  23/24 tờ bỏ <= 20%, một tờ bỏ 60%  -> 0.2 đúng
#   gpt-4.1-mini (23-09) bỏ 35-90%, 8/10 tờ trượt           -> 0.2 vứt dữ liệu tốt
#
# Cả tám tờ ấy có nhãn ĐÚNG PIXEL ở mọi hộp chúng có. `field_plan` là bản
# NHÁP của model, không vào bộ huấn luyện -- ảnh, hộp và KIE mới vào. Trang
# in ít hơn nháp là trang NHỎ HƠN, không phải trang SAI; chiều nguy hiểm là
# `kie` khai giá trị không có trên giấy, và phép kiểm khác lo chiều ấy.
#
# 0.9 = chỉ bắt tờ vứt gần sạch kế hoạch. Đổi model thì đo lại rồi đổi số này,
# đừng đổi mã.
# ---------------------------------------------------------------------------
# kie: LUẬT CỦA NHÃN KIE
#
# --- description_lang ---
#
# Ngôn ngữ của câu mô tả trường. `vi`, `en`, hoặc rỗng = trộn như cũ.
#
# `synthgen/phrasing.py` giữ BỐN cách nói cho mỗi câu gốc: hai tiếng Anh, hai
# tiếng Việt. Trộn CÁCH NÓI là chủ ý và đúng -- một mô hình học trên một câu
# lặp 7 920 lần thì học thuộc câu chứ không học nghĩa. Trộn NGÔN NGỮ là trục
# khác, và trước dòng này không ai chọn nó: nó rơi ra từ chỗ nguồn nào đông.
#
# Đo trên `data/thu1k` (120 bản ghi, 25 538 cặp), sau khi bỏ phần trích chữ
# in ra khỏi phép nhận ngôn ngữ:
#
#   survey / column / clause / sign ... 0% tiếng Anh  (dựng câu TỪ chữ in)
#   implied .......................... 69% tiếng Anh
#   llm .............................. 53% tiếng Anh
#   rule / caption ................... 100% tiếng Anh
#   ---------------------------------------------------
#   CẢ BỘ ............................ 7,0% tiếng Anh
#
# Bảy phần trăm là tỉ lệ tệ nhất cho cả hai đường: quá ít để mô hình học được
# tiếng Anh, đủ nhiều để thành nhiễu. Và 57 trường mang CẢ HAI thứ tiếng --
# cùng một trường, hai ngôn ngữ, trong cùng một bộ.
#
# `vi` vì tờ giấy là tiếng Việt. Muốn một bộ tiếng Anh thì đổi đúng dòng này;
# muốn trộn có chủ đích thì để rỗng và nói rõ trong báo cáo lượt chạy.
# ---------------------------------------------------------------------------
# llm_density: MỘT TỜ GIẤY CHỨA BAO NHIÊU, theo từng mức `density`
#
# `agent/grammar.py` rút một trong bốn mức cho mỗi tài liệu, và lời nhờ trước
# đây chỉ in ra CÁI TÊN (`- density: dense`). Model phải tự đoán "dense" là
# bao nhiêu, và nó đoán thấp: đo trên 12 tài liệu LLM, 626-1 095 ký tự mỗi tờ
# THẬT, trong khi lời nhờ xin 8 000.
#
# Số dưới đây ĐO TỪ NHÁNH LUẬT -- 58 tài liệu trong `data/thu1k`, thứ đã chạy
# và đã được soi bằng mắt:
#
#   ký tự chữ / tờ : p25 854 · trung vị 1 175 · p75 1 661
#   dòng bảng / tờ : p25 4   · trung vị 11    · p75 19
#
# Nên 8 000 ký tự/tờ trong lời nhờ cũ KHÔNG phải mục tiêu đúng -- nó gấp bảy
# lần tờ giấy thật. Giấy tờ hành chính Việt Nam không phải văn xuôi dày; một
# tờ đơn hay biên bản có chừng một nghìn ký tự và rất nhiều khoảng trắng.
#
# `rows` là số dòng bảng MỖI TỜ, không phải cả tài liệu: lời nhờ nhân với số
# tờ đã xin. Đó là cách duy nhất "xin 8 tờ" ra được tám tờ -- bảng phải dài
# gấp tám, chứ không phải chữ phải dày gấp tám.
#
# ---------------------------------------------------------------------------
# ĐO LẠI TRÊN CHÍNH NHÁNH LLM (`data/pilot17`, 60 tờ, 24-09-2026)
#
# Những con số trên ĐO TỪ NHÁNH LUẬT, và đó là chỗ sai. Ở nhánh luật, engine
# tự viết CSS và mỗi `.sheet` là đúng một tờ giấy -- "1 175 ký tự mỗi tờ" là
# số ký tự engine CHỌN đặt lên một tờ. Ở nhánh LLM thì ngược hẳn: model viết
# đúng MỘT `.sheet` (mục 40 của `agent/prompts/page.md`) kèm CSS của chính
# nó, rồi Chromium cắt khối ấy theo chiều cao A4 thật. Nên con số phải trả
# lời một câu KHÁC: một tờ A4 CHỨA ĐƯỢC bao nhiêu ký tự, không phải engine
# thích đặt lên đó bao nhiêu. Cùng một cái tên, hai đại lượng.
#
# Đo trên pilot17, `visible_chars()` chia cho SỐ TỜ CHROMIUM CẮT RA THẬT:
#
#   sức chứa thật một tờ A4 : sparse 1 527 · medium 1 852 · dense 2 002
#   dòng `<tr>` một tờ A4   : sparse 14    · medium 32
#
# Tức lời nhờ đang xin ÍT HƠN sức chứa của chính tờ giấy: medium xin 1 200
# cho một tờ chứa được 1 852. Một model tuân thủ HOÀN HẢO cũng chỉ dàn ra
# 1 200/1 852 = 0,65 tờ cho mỗi tờ đã xin -- đã dưới ngưỡng 0,6 của
# `SHEET_SHORTFALL_RATIO` trước khi model kịp viết thiếu một chữ nào.
#
# Và model viết thiếu thật: giao được 57% số ký tự đã xin (trung vị, 42 lời
# gọi trả lời được). Nhân hai hiệu ứng: 0,65 x 0,57 = 0,37 tờ cho mỗi tờ xin.
# Đo được trên 23 tờ trượt vì "xin N tờ, dàn ra M tờ": trung vị 0,41, và
# KHÔNG MỘT TỜ NÀO chạm quá 0,50. Mô hình khớp với thực đo ở cả ba mức
# (dự đoán 0,32/0,37/0,47 -- đo được 0,45/0,41/0,33).
#
# Nên số mới = sức chứa thật / tỉ lệ tuân thủ (0,57), làm tròn. `rows` nhân
# cùng hệ số của mức ấy, để hai lời dặn trong cùng một brief không cãi nhau:
# "viết 3 250 ký tự" đứng cạnh "11 dòng bảng" là hai con số chỏi nhau, và đo
# trên `data/23-09-llm-e` thì model nghe con số NHỎ.
#
# Sức chứa trên là CẬN DƯỚI: một tài liệu cắt ra đúng 1 tờ có thể mới đầy
# nửa tờ, nên phép chia cho số tờ thật nói thấp đi chứ không nói cao lên.
# Số dưới đây vì thế là lựa chọn dè dặt, không phải nới tay.
# `very_dense` KHÔNG có tờ nào trong pilot17 để đo (n=0). Sức chứa của nó
# ngoại suy theo bước đang thu nhỏ dần của ba mức đo được (1 527 -> 1 852:
# +325; 1 852 -> 2 002: +150; nên +150 nữa ~ 2 150), rồi chia cùng một tỉ lệ
# tuân thủ. Ghi rõ ra đây vì đó là con số DUY NHẤT dưới đây không có phép đo
# đứng sau -- lượt chạy nào có tờ `very_dense` thì đo lại và sửa.
llm_density:
  sparse:     {chars: 2700, rows: 16}
  medium:     {chars: 3300, rows: 30}
  dense:      {chars: 3550, rows: 40}
  very_dense: {chars: 3800, rows: 45}

kie:
  description_lang: vi

gate:
  orphan_share: 0.99
  plan_drop_share: 0.9

# ĐƯỜNG SINH NÀO CHẠY KHI KHÔNG AI NÓI RÕ.
#
# Ba đường cùng tồn tại, cùng đổ về một bản ghi (`pipeline/record.py`), và
# không đường nào thay đường nào:
#
#   rule      `synthgen/run.py`             0 lời gọi model
#   page      `agent/compose_page.py`       1 lời gọi cho MỖI trang
#   template  `agent/compose_template.py`   1 lời gọi cho mỗi PHÔI, rồi
#             + `synthgen/run_fill.py`      N trang mỗi phôi, 0 lời gọi
#
# Con số ở `docs/duong-sinh-phoi.md`. Tóm tắt: sinh 10 000 ảnh tốn 45 455 lời
# gọi ở `page` và 909 ở `template` -- 50 lần ít hơn, cùng tỉ lệ đạt cổng.
#
# Vì sao là CẤU HÌNH chứ không phải một `if` trong mã: `page` đo được và còn
# giữ, vì nó là đường duy nhất cho một trang mà cấu trúc chưa có phôi nào tả
# được. Ai muốn so hai đường trên cùng một lượt chỉ đổi một dòng ở đây, hoặc
# truyền `--path` cho `tasks.py` -- không ai phải sửa Python để chạy phép thử
# đối chứng, và một phép thử phải sửa mã mới chạy được là một phép thử không
# ai chạy.
#
# `per_template` là số tờ mỗi phôi khi `path: template`. 50 là chỗ đo được ở
# `docs/duong-sinh-phoi.md`: dưới 20 thì cái giá viết phôi chưa trả hết, trên
# 200 thì tổ hợp giá trị của một phôi bắt đầu cạn (`exact_collisions` trong
# `fill_report.json` là con số nói lúc nào).
llm_path:
  path: page
  per_template: 50

# Ô NÀO ĐƯỢC ĐIỀN TAY, theo từng loại giấy.
#
# `handwriting.fill()` viết lại chính chữ đã in của mỗi run, nên NỘI DUNG chữ
# viết tay vốn đã khớp tài liệu. Chỗ chưa khớp là CHỖ ĐẶT BÚT: bản trước dùng
# đúng một danh sách `invoice.field + invoice.words + sign.name +
# survey.answer` cho MỌI loại chứng từ, nên một `BẢNG LƯƠNG` in máy cũng có ô
# viết tay, còn một `SỔ KHO` -- thứ ngoài đời viết tay từ đầu tới cuối -- chỉ
# được viết mấy ô trường.
#
# Luật đọc TÊN phôi, cùng cơ chế `allow:` ở trên. `default` là danh sách cũ,
# nên phôi không khớp luật nào giữ nguyên hành vi trước đây.
#
# `none` = tờ giấy này KHÔNG có chữ viết tay. Một bảng lương, một tờ báo, một
# thực đơn in sẵn thì không ai cầm bút viết lên.
hand_kinds:
  default: [invoice.field, invoice.words, sign.name, survey.answer]

  rules:
    # Sổ sách ghi tay: người ta viết cả dòng hàng, không chỉ mấy ô trường.
    - title_any: [sổ kho, thẻ kho, nhật ký, sổ liên lạc, sổ khám, học bạ,
                  chấm công, giao nhận, kiểm kê]
      kinds: [invoice.field, invoice.words, sign.name, survey.answer,
              menu.name, menu.qty, menu.note, menu.unit]

    # Biên nhận, phiếu thu chi viết tay tại quầy: thêm số tiền và dòng bằng chữ.
    - title_any: [biên nhận, phiếu thu, phiếu chi, biên lai, giấy nộp tiền,
                  vé, phiếu gửi]
      kinds: [invoice.field, invoice.words, sign.name, survey.answer,
              menu.amount, menu.qty]

    # In máy hoàn toàn: bảng lương, bảng kê, sao kê, thực đơn, trang báo. Chỉ
    # chữ ký là viết tay -- và đó đúng là thứ duy nhất người ta đặt bút vào.
    - title_any: [bảng lương, bảng kê, sao kê, thực đơn, trang, rao vặt,
                  thời khoá biểu, bảng điểm, danh sách]
      kinds: [sign.name]

    # Giấy chứng nhận, bằng cấp, thẻ: phôi in sẵn, điền tay phần cá nhân.
    - title_any: [chứng nhận, chứng chỉ, bằng, thẻ, giấy phép, khai sinh,
                  kết hôn]
      kinds: [invoice.field, sign.name]
