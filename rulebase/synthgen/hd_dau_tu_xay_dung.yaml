# phôi khai bằng file — xem synthgen/archetypes.py
#
# Sinh theo lô "300 phôi chia đều": tên là `<thể loại> + <lĩnh vực>`,
# đúng cách chứng từ hành chính Việt Nam đặt tên.
#
# CÓ bảng: rải đều để cả kho giữ ~10% phôi luôn có bảng.
# Trần số tờ và khối chảy đọc từ THỂ LOẠI in trên tiêu đề
# ("HỢP ĐỒNG"), không theo vị trí trong vòng sinh — xem lịch sử:
# bậc cũ gán bằng `index % 3` nên mọi thể loại đều chia 1/3-1/3-1/3,
# và một HỢP ĐỒNG bị khoá một tờ. Khối chảy: clauses; trần: không khai.
id: hd_dau_tu_xay_dung
titles:
- HỢP ĐỒNG VỀ ĐẦU TƯ XÂY DỰNG
- HỢP ĐỒNG CÔNG TÁC ĐẦU TƯ XÂY DỰNG
subtitles:
- ''
- Năm ....
- 'Số: ..../....'
profile: invoice
org_kind: company
national: 0.12
fields:
- party_a
- party_b
- value
- term
field_span:
- 3
- 4
columns:
- - stt
  - name
  - unit
  - qty
  - amount
- - stt
  - name
  - date
  - note
totals: money
words: false
sign_sets:
- - ĐẠI DIỆN BÊN A
  - ĐẠI DIỆN BÊN B
- - BÊN GIAO
  - BÊN NHẬN
notes:
- Hai bên cam kết thực hiện đúng nội dung đã thoả thuận.
- Mọi sửa đổi phải lập thành văn bản có chữ ký hai bên.
rows:
- 4
- 36
always:
- letterhead
- doctitle
- clauses
- signatures
optional:
- meta
- fields
- notes
- footer
- footnote
- checks
en_ok: true
